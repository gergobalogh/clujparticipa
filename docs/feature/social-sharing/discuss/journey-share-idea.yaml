schema_version: "1.0"
id: "share-idea"
name: "Share an Idea"
persona: "Maria"
job_ids:
  - "JOB-006"
  - "JOB-007"
trigger: "Maria has supported an idea and wants to rally her neighbors"
steps:
  - id: "S1"
    name: "Decide to share"
    action: "Form intent to share the idea with personal network"
    expected_output: "Intent to share formed"
    emotional_state: "motivated"
  - id: "S2"
    name: "Locate share controls"
    action: "Find share buttons on the idea detail page"
    expected_output: "Share UI discovered — WhatsApp, Facebook, copy-link"
    emotional_state: "relieved"
    shared_artifacts:
      - name: "ideaId"
        type: "string"
        source: "URL params"
  - id: "S3"
    name: "Choose channel"
    action: "Tap WhatsApp icon → WhatsApp Web opens with pre-filled message"
    expected_output: "WhatsApp compose window with idea title, category, district, URL"
    emotional_state: "satisfied"
    shared_artifacts:
      - name: "shareText"
        type: "string"
        source: "generated from idea data + i18n template"
      - name: "shareUrl"
        type: "string"
        source: "idea detail page URL + UTM params"
  - id: "S4"
    name: "Send"
    action: "Review pre-filled message, select group, send"
    expected_output: "Message sent to WhatsApp group"
    emotional_state: "confident"
  - id: "S5"
    name: "Recipient sees preview"
    action: "Group members see WhatsApp preview card from OG metadata"
    expected_output: "Rich preview card: image, title, district, support count"
    emotional_state: "curious"
    shared_artifacts:
      - name: "ogTitle"
        type: "string"
        source: "idea.title"
      - name: "ogImage"
        type: "string"
        source: "idea.images[0].url OR generated placeholder"
      - name: "ogDescription"
        type: "string"
        source: "idea.description truncated + category/district"
  - id: "S6"
    name: "Recipient clicks through"
    action: "Tap preview card → land on idea detail page"
    expected_output: "New visitor on idea detail page"
    emotional_state: "engaged"
  - id: "S7"
    name: "Recipient supports"
    action: "Read idea, click Back this idea"
    expected_output: "Vote recorded, support count incremented"
    emotional_state: "empowered"
error_paths:
  - step: "S3"
    failure: "WhatsApp not installed"
    recovery: "Fallback: copy link with toast notification"
  - step: "S5"
    failure: "Idea has no images"
    recovery: "Category-colored placeholder image with title overlay"
  - step: "S5"
    failure: "WhatsApp serves stale OG cache"
    recovery: "UTM param forces re-fetch on first click"
