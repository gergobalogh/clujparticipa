schema_version: "1.0"
jobs:
  - id: "JOB-001"
    statement: "When I see a problem in my neighborhood, I want to submit my idea and track whether it gets acted on, so I can decide whether engaging with the city is worth my time."
    abstraction_level: "physical"
    type: "functional"
    context: "Romanian civic participation prototype for Cluj-Napoca; district-first, low institutional trust, trilingual"
    emotional_job: "When I submit an idea for my neighborhood, I want to feel that my contribution matters and is taken seriously, so I don't regret investing my time and hope."
    social_job: "When I participate in civic improvements, I want to be seen as someone who cares about my community, so I can build credibility as an engaged resident rather than a complainer."
    outcomes:
      - id: "O1"
        statement: "Minimize the time it takes to see whether a submitted idea has progressed toward implementation"
        type: "speed"
        importance: 9
        satisfaction: 3
        score: 15
        status: "under-served"
      - id: "O2"
        statement: "Minimize the likelihood of a resident believing their engagement is ignored because status changes are invisible"
        type: "likelihood_of_result"
        importance: 9
        satisfaction: 2
        score: 16
        status: "under-served"
      - id: "O3"
        statement: "Minimize the time it takes for a new visitor to understand what this platform does and whether it is legitimate"
        type: "speed"
        importance: 8
        satisfaction: 3
        score: 13
        status: "under-served"
      - id: "O4"
        statement: "Minimize the effort required to find ideas relevant to one's own neighborhood"
        type: "ease"
        importance: 7
        satisfaction: 5
        score: 9
        status: "appropriately_served"
      - id: "O5"
        statement: "Minimize the likelihood of a resident abandoning participation because the experience feels untrustworthy or amateur"
        type: "likelihood_of_result"
        importance: 8
        satisfaction: 4
        score: 12
        status: "appropriately_served"
    features:
      - "clujparticipa-redesign"

  - id: "JOB-002"
    statement: "When I see few ideas being submitted or users leaving without acting, I want to see exactly where in the journey they drop off and what they did before leaving, so I can fix the broken step before more users lose trust."
    abstraction_level: "physical"
    type: "functional"
    context: "Civic participation prototype; operator needs data-driven UX iteration"
    emotional_job: "When I see low engagement numbers, I want to feel confident I know WHY rather than guessing, so I can act decisively instead of hoping."
    social_job: "When I report progress to the coalition, I want to show data-backed evidence that the platform is improving, so I am seen as a credible steward of civic resources."
    outcomes:
      - id: "O6"
        statement: "Minimize the time it takes to identify which page or action causes user drop-off"
        type: "speed"
        importance: 9
        satisfaction: 1
        score: 81
        status: "critically-under-served"
    features:
      - "umami-analytics"

  - id: "JOB-003"
    statement: "When I invest effort in a new feature, I want to measure whether it actually changes user behavior, so I can double down on what works and cut what doesn't."
    abstraction_level: "physical"
    type: "functional"
    context: "Feature investment without measurement is guesswork"
    emotional_job: "When I ship a feature, I want to feel certainty that it mattered, rather than shipping into a void and never knowing."
    social_job: "When I discuss priorities with the team, I want to bring evidence of what users actually do, so I'm not just advocating from opinion."
    outcomes:
      - id: "O7"
        statement: "Minimize the likelihood of investing in features that don't change user behavior"
        type: "likelihood_of_result"
        importance: 8
        satisfaction: 1
        score: 72
        status: "critically-under-served"
    features:
      - "umami-analytics"

  - id: "JOB-004"
    statement: "When I visit a civic participation site, I want to know that my behavior on the site isn't being sold or profiled, so I can engage honestly without feeling surveilled."
    abstraction_level: "physical"
    type: "emotional"
    context: "Civic platform users are privacy-sensitive; surveillance undermines participation"
    emotional_job: "When I see a tracking notice, I want to feel respected and informed, not tricked or watched."
    social_job: "When I tell neighbors about this platform, I want to say 'it respects your privacy' with confidence, so I'm not recommending a surveillance tool."
    outcomes:
      - id: "O8"
        statement: "Minimize the likelihood of a resident abandoning participation because the platform feels surveilled"
        type: "likelihood_of_result"
        importance: 7
        satisfaction: 5
        score: 35
        status: "appropriately-served"
    features:
      - "umami-analytics"

  - id: "JOB-005"
    statement: "When I return to the platform after weeks away, I want to see evidence that things are happening, so I feel my participation matters and the platform isn't abandoned."
    abstraction_level: "physical"
    type: "functional"
    context: "Return visits need social proof of activity to sustain engagement"
    emotional_job: "When I see stale content, I feel like I wasted my time. When I see movement, I feel hopeful."
    social_job: "When I see others participating actively, I feel part of a community effort rather than shouting into the void."
    outcomes:
      - id: "O9"
        statement: "Minimize the likelihood of a resident abandoning the platform because it appears abandoned"
        type: "likelihood_of_result"
        importance: 6
        satisfaction: 3
        score: 42
        status: "under-served"
    features:
      - "umami-analytics"

changelog:
