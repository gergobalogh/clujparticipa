schema_version: "1.0"
jobs:
  - id: "JOB-001"
    statement: "When I see a problem in my neighborhood, I want to submit my idea and track whether it gets acted on, so I can decide whether engaging with the city is worth my time."
    abstraction_level: "physical"
    type: "functional"
    context: "Romanian civic participation prototype for Cluj-Napoca; district-first, low institutional trust, trilingual"
    emotional_job: "When I submit an idea for my neighborhood, I want to feel that my contribution matters and is taken seriously, so I don't regret investing my time and hope."
    social_job: "When I participate in civic improvements, I want to be seen as someone who cares about my community, so I can build credibility as an engaged resident rather than a complainer."
    outcomes:
      - id: "O1"
        statement: "Minimize the time it takes to see whether a submitted idea has progressed toward implementation"
        type: "speed"
        importance: 9
        satisfaction: 3
        score: 15
        status: "under-served"
      - id: "O2"
        statement: "Minimize the likelihood of a resident believing their engagement is ignored because status changes are invisible"
        type: "likelihood_of_result"
        importance: 9
        satisfaction: 2
        score: 16
        status: "under-served"
      - id: "O3"
        statement: "Minimize the time it takes for a new visitor to understand what this platform does and whether it is legitimate"
        type: "speed"
        importance: 8
        satisfaction: 3
        score: 13
        status: "under-served"
      - id: "O4"
        statement: "Minimize the effort required to find ideas relevant to one's own neighborhood"
        type: "ease"
        importance: 7
        satisfaction: 5
        score: 9
        status: "appropriately_served"
      - id: "O5"
        statement: "Minimize the likelihood of a resident abandoning participation because the experience feels untrustworthy or amateur"
        type: "likelihood_of_result"
        importance: 8
        satisfaction: 4
        score: 12
        status: "appropriately_served"
    features:
      - "clujparticipa-redesign"

  - id: "JOB-002"
    statement: "When I see few ideas being submitted or users leaving without acting, I want to see exactly where in the journey they drop off and what they did before leaving, so I can fix the broken step before more users lose trust."
    abstraction_level: "physical"
    type: "functional"
    context: "Civic participation prototype; operator needs data-driven UX iteration"
    emotional_job: "When I see low engagement numbers, I want to feel confident I know WHY rather than guessing, so I can act decisively instead of hoping."
    social_job: "When I report progress to the coalition, I want to show data-backed evidence that the platform is improving, so I am seen as a credible steward of civic resources."
    outcomes:
      - id: "O6"
        statement: "Minimize the time it takes to identify which page or action causes user drop-off"
        type: "speed"
        importance: 9
        satisfaction: 1
        score: 81
        status: "critically-under-served"
    features:
      - "umami-analytics"

  - id: "JOB-003"
    statement: "When I invest effort in a new feature, I want to measure whether it actually changes user behavior, so I can double down on what works and cut what doesn't."
    abstraction_level: "physical"
    type: "functional"
    context: "Feature investment without measurement is guesswork"
    emotional_job: "When I ship a feature, I want to feel certainty that it mattered, rather than shipping into a void and never knowing."
    social_job: "When I discuss priorities with the team, I want to bring evidence of what users actually do, so I'm not just advocating from opinion."
    outcomes:
      - id: "O7"
        statement: "Minimize the likelihood of investing in features that don't change user behavior"
        type: "likelihood_of_result"
        importance: 8
        satisfaction: 1
        score: 72
        status: "critically-under-served"
    features:
      - "umami-analytics"

  - id: "JOB-004"
    statement: "When I visit a civic participation site, I want to know that my behavior on the site isn't being sold or profiled, so I can engage honestly without feeling surveilled."
    abstraction_level: "physical"
    type: "emotional"
    context: "Civic platform users are privacy-sensitive; surveillance undermines participation"
    emotional_job: "When I see a tracking notice, I want to feel respected and informed, not tricked or watched."
    social_job: "When I tell neighbors about this platform, I want to say 'it respects your privacy' with confidence, so I'm not recommending a surveillance tool."
    outcomes:
      - id: "O8"
        statement: "Minimize the likelihood of a resident abandoning participation because the platform feels surveilled"
        type: "likelihood_of_result"
        importance: 7
        satisfaction: 5
        score: 35
        status: "appropriately-served"
    features:
      - "umami-analytics"

  - id: "JOB-005"
    statement: "When I return to the platform after weeks away, I want to see evidence that things are happening, so I feel my participation matters and the platform isn't abandoned."
    abstraction_level: "physical"
    type: "functional"
    context: "Return visits need social proof of activity to sustain engagement"
    emotional_job: "When I see stale content, I feel like I wasted my time. When I see movement, I feel hopeful."
    social_job: "When I see others participating actively, I feel part of a community effort rather than shouting into the void."
    outcomes:
      - id: "O9"
        statement: "Minimize the likelihood of a resident abandoning the platform because it appears abandoned"
        type: "likelihood_of_result"
        importance: 6
        satisfaction: 3
        score: 42
        status: "under-served"
    features:
      - "umami-analytics"

  - id: "JOB-006"
    statement: "When I find an idea I believe in, I want to spread the word to my community, so I can rally support and increase its chances of being selected."
    abstraction_level: "physical"
    type: "functional"
    context: "Civic ideas spread through personal networks — WhatsApp groups, Facebook community groups, neighborhood chats. Sharing is the growth engine."
    emotional_job: "When I share a civic idea, I want to feel like an effective advocate whose action matters, not someone shouting into the void with a broken link."
    social_job: "When I share, I want to be seen as a constructive community member, not a spammer. A rich preview makes the link look credible and professional."
    outcomes:
      - id: "O10"
        statement: "Minimize the effort to share a civic idea with a personal network"
        type: "ease"
        importance: 8
        satisfaction: 1
        score: 15
        status: "under-served"
      - id: "O11"
        statement: "Minimize the likelihood of a shared link being ignored because it has no preview"
        type: "likelihood_of_result"
        importance: 8
        satisfaction: 1
        score: 15
        status: "under-served"
    features:
      - "social-sharing"

  - id: "JOB-007"
    statement: "When someone shares a civic idea link with me, I want to see at a glance what the idea is about and whether it's worth clicking, so I don't waste time on irrelevant content."
    abstraction_level: "physical"
    type: "functional"
    context: "Recipients judge links by their preview card. Blank links get ignored; rich previews earn the click."
    emotional_job: "When I see a rich preview, I feel the platform is legitimate. When I see a bare URL, I assume spam."
    social_job: "When I click through from a compelling preview, I'm more likely to share it further — good previews compound sharing behavior."
    outcomes:
      - id: "O12"
        statement: "Minimize the time for a recipient to understand what a shared idea is about before clicking"
        type: "speed"
        importance: 7
        satisfaction: 1
        score: 12
        status: "under-served"
      - id: "O13"
        statement: "Minimize the likelihood of a recipient dismissing a shared link as spam because it has no preview"
        type: "likelihood_of_result"
        importance: 7
        satisfaction: 1
        score: 12
        status: "under-served"
    features:
      - "social-sharing"

  - id: "JOB-008"
    statement: "When a comment is posted, I want the platform to screen it for toxicity automatically, so toxic content is never publicly visible for hours and I can trust the discussion space is safe 24/7."
    abstraction_level: "physical"
    type: "functional"
    context: "Civic participation prototype; toxic content destroys trust faster than any other failure mode; manual moderation doesn't scale for a pilot"
    emotional_job: "When I see a comment section, I want to feel that someone is watching out for abuse, so I don't feel anxious about encountering harassment on a civic platform."
    social_job: "When I tell neighbors about the platform, I want to say 'it keeps things civil automatically,' so I'm recommending a safe space rather than an unmoderated free-for-all."
    outcomes:
      - id: "O14"
        statement: "Minimize time toxic content is publicly visible"
        type: "speed"
        importance: 9
        satisfaction: 1
        score: 72
        status: "critically-under-served"
      - id: "O15"
        statement: "Minimize unmoderated coverage gaps (nights/weekends)"
        type: "likelihood_of_result"
        importance: 9
        satisfaction: 1
        score: 72
        status: "critically-under-served"
    features:
      - "ai-comment-moderation"

  - id: "JOB-009"
    statement: "When my pilot gets more traffic, I want to trust that every comment is screened consistently, so I don't have to read every single comment myself or worry that something slipped through overnight."
    abstraction_level: "physical"
    type: "functional"
    context: "Scaling moderation beyond manual review; admin cannot be online 24/7"
    emotional_job: "When I wake up and check the platform, I want to feel confident that no toxic content has been sitting publicly for hours."
    social_job: "When I report to the coalition, I want to show that moderation is automated and consistent, so I'm seen as a responsible platform operator."
    outcomes:
      - id: "O16"
        statement: "Minimize admin effort to review all comments"
        type: "ease"
        importance: 8
        satisfaction: 2
        score: 48
        status: "under-served"
    features:
      - "ai-comment-moderation"

  - id: "JOB-010"
    statement: "When my comment is flagged by the AI moderator, I want to understand why and have a path to contest it, so a false positive doesn't permanently silence my contribution."
    abstraction_level: "physical"
    type: "functional"
    context: "False positives are inevitable with AI moderation; residents need transparency and recourse"
    emotional_job: "When my comment is held for review, I want to feel respected and heard, not arbitrarily censored by a machine."
    social_job: "When I see that flagged comments get human review, I feel the platform values my participation even when the algorithm is uncertain."
    outcomes:
      - id: "O17"
        statement: "Minimize likelihood of false positives silencing legitimate speech"
        type: "likelihood_of_result"
        importance: 7
        satisfaction: 3
        score: 28
        status: "under-served"
    features:
      - "ai-comment-moderation"

